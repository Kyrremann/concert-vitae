name: Deploy Scaleway Functions

on:
  push:
    branches: [main]
    paths:
      - 'function/*'
      - '.github/workflows/deploy.yaml'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: function
      - run: cargo test --workspace
        working-directory: function

jobs:
  if: github.ref == 'refs/heads/main'
  needs: check
  deploy:
    permissions:
      contents: read
    uses: Kyrremann/oslogigguide/.github/workflows/scaleway.yaml@main
    with:
      directory: function
      function-id: 9bcd44be-12d1-48a9-b341-528ba893dcb9
    secrets:
      scaleway-token: ${{ secrets.SCW_SECRET_KEY }}
